<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>PolyNav</title>
</head>
<body>

<!-- Background layer -->
<div class="bg" aria-hidden="true"></div>

<!-- Title bar -->
<header class="appbar">
    <span class="appbar-title">PolyNav</span>
    <span class="appbar-meta">
        <span id="version">v3</span>
        <span class="appbar-sep" aria-hidden="true"></span>
        <span id="time" class="time-label">—</span>
    </span>
</header>

<!-- Main canvas viewport -->
<main class="viewport">
    <canvas id="mesh"></canvas>
</main>

<!-- Bottom toolbar -->
<div class="toolbar">
    <div class="toolbar-group">
        <select id="preset" class="toolbar-select">
            <option value="random-6">Random 6</option>
            <option value="random-12" selected>Random 12</option>
            <option value="random-24">Random 24</option>
            <option value="circle-12">Circle</option>
            <option value="grid-16">Grid</option>
        </select>
        <button id="generate" class="btn">Triangulate</button>
    </div>
    <div id="stats" class="toolbar-stats"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
